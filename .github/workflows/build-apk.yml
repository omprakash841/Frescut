name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          java -version
          echo "JAVA_HOME=${JAVA_HOME:-}"
          if [ -z "${JAVA_HOME:-}" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON_SECRET:-}" ]; then
            echo "Writing app/google-services.json from GOOGLE_SERVICES_JSON secret..."
            printf '%s\n' "$GOOGLE_SERVICES_JSON_SECRET" > app/google-services.json
          elif [ -f "app/google-services.json" ] && [ -s "app/google-services.json" ]; then
            echo "Using existing app/google-services.json from repository."
          else
            echo "::error::google-services.json missing"
            echo "google-services.json missing"
            exit 1
          fi
          if [ ! -f "app/google-services.json" ] || [ ! -s "app/google-services.json" ]; then
            echo "::error::google-services.json missing"
            echo "google-services.json missing"
            exit 1
          fi

      - name: Restore consistent debug keystore
        run: |
          set -euo pipefail
          if [ -f ./debug.keystore.base64 ] && [ -s ./debug.keystore.base64 ]; then
            echo "Restoring ./debug.keystore from debug.keystore.base64..."
            base64 -d ./debug.keystore.base64 > ./debug.keystore
          elif [ ! -f ./debug.keystore ]; then
            echo "Creating fallback ./debug.keystore..."
            "${JAVA_HOME}/bin/keytool" -genkeypair \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          if [ ! -f ./debug.keystore ] || [ ! -s ./debug.keystore ]; then
            echo "::error::Failed to prepare ./debug.keystore."
            exit 1
          fi
          echo "Confirmed ./debug.keystore is ready."

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Accept Android SDK licenses
        continue-on-error: true
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses || true
          fi

      - name: Build Debug APK
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon --console=plain 2>&1 | tee build.log

      - name: Upload build-log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Summarize failure from build.log
        if: failure()
        run: |
          {
            echo "## ❌ Build Failed Summary"
            echo ""
            if [ -f build.log ]; then
              FIRST_TASK=$(grep -m 1 "Execution failed for task" build.log || true)
              if [ -n "$FIRST_TASK" ]; then
                echo "**Failing Task:** \`$FIRST_TASK\`"
                echo ""
              fi
              echo "### What went wrong"
              echo '```text'
              grep -A 20 "What went wrong:" build.log || tail -n 30 build.log
              echo '```'
            else
              echo "build.log was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify debug APK
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ] || [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Expected APK not found or empty at $EXPECTED_APK"
            exit 1
          fi
          echo "Verified debug APK at $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME=$(printf '%s' "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi
          RELEASE_ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_TMP_DIR="${RUNNER_TEMP}/apk-release-asset-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$RELEASE_TMP_DIR"
          RELEASE_ASSET_PATH="${RELEASE_TMP_DIR}/${RELEASE_ASSET_NAME}"
          cp "$EXPECTED_APK" "$RELEASE_ASSET_PATH"
          echo "asset_path=${RELEASE_ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_TAG="v1.0.${GITHUB_RUN_NUMBER}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          RELEASE_NOTES="Automated debug APK build #${GITHUB_RUN_NUMBER} (${GITHUB_SHA})."
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --target "$GITHUB_SHA" \
            --latest
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          RELEASE_TAG="v1.0.${GITHUB_RUN_NUMBER}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq '.url' 2>/dev/null || true)
            if [ -n "$RELEASE_URL" ]; then
              {
                echo "## ✅ Debug APK Built and Published to GitHub Releases"
                echo ""
                echo "- **Release Tag:** \`${RELEASE_TAG}\`"
                echo "- **Release Title:** ${RELEASE_TITLE}"
                echo "- **Release Page URL:** [Download from GitHub Release](${RELEASE_URL})"
                echo "- **APK Asset Filename:** \`${ASSET_NAME}\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
