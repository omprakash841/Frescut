name: Build Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        continue-on-error: true
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          else
            yes | sdkmanager --licenses || true
          fi

      - name: Prepare Config & Debug Keystore
        run: |
          # 1. Ensure .env.example and .env have safe non-empty placeholder values
          if [ ! -f .env.example ]; then
            echo "MAPS_API_KEY=MY_MAPS_API_KEY" > .env.example
          else
            sed -i 's/^\([A-Za-z0-9_]*\)=$/\1=DUMMY_VALUE/g' .env.example
          fi
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          # 2. Ensure debug.keystore exists for signingConfig debugConfig
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
          GRADLE_OPTS: -Dorg.gradle.daemon=false
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon --console=plain 2>&1 | tee build.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Write Failure Summary
        if: failure()
        run: |
          {
            echo "## ❌ Build Debug APK Failed"
            echo ""
            echo "### Failing Gradle Task"
            echo '```'
            grep -m 1 "Execution failed for task" build.log || echo "No 'Execution failed for task' line found in build.log"
            echo '```'
            echo ""
            echo "### What went wrong (20 lines)"
            echo '```'
            grep -A 20 "What went wrong" build.log || tail -n 30 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frescut-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare APK and Release Notes
        if: success()
        id: release_meta
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk frescut-debug.apk
          COMMIT_MSG=$(git log -1 --pretty=%B | tr '\n' ' ')
          BUILD_DATE=$(TZ='Asia/Kolkata' date '+%d %b %Y, %I:%M %p IST')
          {
            echo "body<<EOF"
            echo "**Commit:** ${COMMIT_MSG}"
            echo "**Build Date:** ${BUILD_DATE}"
            echo "**Commit SHA:** ${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or Update Latest Pre-Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Debug APK
          body: ${{ steps.release_meta.outputs.body }}
          prerelease: true
          files: frescut-debug.apk
          overwrite_files: true
